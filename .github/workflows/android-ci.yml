name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode release keystore
        id: keystore
        env:
          AVENRA_RELEASE_KEYSTORE_B64: ${{ secrets.AVENRA_RELEASE_KEYSTORE_B64 }}
        run: |
          key_store_path="$(mktemp "$RUNNER_TEMP/avenra-release.XXXXXX")"
          printf '%s' "$AVENRA_RELEASE_KEYSTORE_B64" | base64 --decode > "$key_store_path"
          echo "path=$key_store_path" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        env:
          AVENRA_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          AVENRA_RELEASE_STORE_PASSWORD: ${{ secrets.AVENRA_RELEASE_STORE_PASSWORD }}
          AVENRA_RELEASE_KEY_ALIAS: ${{ secrets.AVENRA_RELEASE_KEY_ALIAS }}
          AVENRA_RELEASE_KEY_PASSWORD: ${{ secrets.AVENRA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate signed release APK
        run: |
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          echo "AVENRA_RELEASE_APK=$apk_path" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ${{ env.AVENRA_RELEASE_APK }}
